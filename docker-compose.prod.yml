services:
  # Public entry: Caddy terminates TLS (automatic HTTPS) and routes one
  # public URL to the internal app. Set PUBLIC_URL in .env to your domain
  # (e.g. https://chat.waffarha.com); first boot fetches the cert.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
