<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Waffarha Assistant</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F2661E;
    --orange-dark:#D9541A;
    --orange-soft:#FFA366;
    --cream:#FFF6EE;
    --surface:#FFFFFF;
    --peach:#FFEFE2;
    --peach-line:#F3DFCB;
    --ink:#2A2118;
    --ink-soft:#8A7A6C;
    --green:#2FA84F;
    --green-soft:#E7F7EC;
    --shadow-orange: rgba(242,102,30,0.16);
    --radius-lg:22px;
    --radius-md:14px;
    --font-display:'Baloo 2', 'Cairo', sans-serif;
    --font-body:'Inter', 'Cairo', sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --orange:#F2661E;
    --orange-dark:#FF8952;
    --orange-soft:#B85A2C;
    --cream:#161210;
    --surface:#221C17;
    --peach:#2B231C;
    --peach-line:#3C3128;
    --ink:#F3E9DD;
    --ink-soft:#A6968A;
    --green:#3FCB63;
    --green-soft:#173321;
    --shadow-orange: rgba(242,102,30,0.30);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  html[dir="rtl"] body{ font-family:'Cairo', sans-serif; }
  button{font-family:inherit;}
  ::selection{ background:var(--orange-soft); color:#fff; }
  :focus-visible{ outline:2.5px solid var(--orange); outline-offset:2px; border-radius:8px; }

  .shell{ display:flex; height:100vh; overflow:hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:288px; flex-shrink:0; background:var(--surface);
    border-inline-end:1px solid var(--peach-line);
    display:flex; flex-direction:column;
    transition:transform .25s ease;
  }
  .sidebar-top{ padding:20px 18px 14px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:var(--orange);
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 4px 10px var(--shadow-orange);
    flex-shrink:0;
  }
  .brand-mark span{ color:#fff; font-family:var(--font-display); font-weight:800; font-size:19px; }
  .brand-mark .dot{ position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; top:8px; right:7px; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px; }
  .brand-sub{ font-size:11px; color:var(--ink-soft); margin-top:-2px; }

  .new-chat-btn{
    width:100%; display:flex; align-items:center; gap:9px; justify-content:center;
    background:var(--orange); color:#fff; border:none; border-radius:13px;
    padding:11px 14px; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 6px 14px var(--shadow-orange);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .new-chat-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 18px var(--shadow-orange); }
  .new-chat-btn:active{ transform:translateY(0); }

  .history-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft);
    font-weight:700; padding:18px 18px 8px;
  }
  .history-list{ flex:1; overflow-y:auto; padding:0 12px; display:flex; flex-direction:column; gap:3px; }
  .history-item{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:11px;
    cursor:pointer; border:1px solid transparent; background:transparent;
    font-size:13.5px; color:var(--ink); text-align:start; width:100%;
  }
  .history-item:hover{ background:var(--peach); }
  .history-item.active{ background:var(--peach); border-color:var(--peach-line); font-weight:600; }
  .history-item .hi-dot{ width:6px; height:6px; border-radius:50%; background:var(--orange-soft); flex-shrink:0; }
  .history-item .hi-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .history-item .hi-delete{
    opacity:0; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:7px; border:none; background:transparent; color:var(--ink-soft);
    cursor:pointer; transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .history-item:hover .hi-delete, .history-item .hi-delete:focus-visible{ opacity:1; }
  .history-item .hi-delete:hover{ background:rgba(224,72,61,.14); color:#E0483D; }

  .sidebar-bottom{ padding:14px 16px 16px; border-top:1px solid var(--peach-line); display:flex; flex-direction:column; gap:10px; }
  .sidebar-bottom-row{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--peach-line); background:var(--peach);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--orange-dark); flex-shrink:0;
    transition:background .15s ease, transform .12s ease;
  }
  .theme-toggle:hover{ transform:translateY(-1px); }
  .theme-toggle svg{ display:block; }
  .lang-toggle{
    margin-inline-start:auto; display:flex; background:var(--peach); border-radius:20px; padding:3px; gap:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; padding:6px 11px; border-radius:16px; font-size:12px; font-weight:700;
    color:var(--ink-soft); cursor:pointer;
  }
  .lang-toggle button.active{ background:var(--orange); color:#fff; }
  .profile-chip{
    display:flex; align-items:center; gap:9px; border:none; background:transparent; cursor:pointer;
    padding:6px; margin-inline-start:-6px; border-radius:12px; width:100%; text-align:start;
    transition:background .15s ease;
  }
  .profile-chip:hover{ background:var(--peach); }
  .profile-avatar{ width:32px; height:32px; border-radius:50%; background:var(--peach); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .profile-name{ font-size:13px; font-weight:600; }
  .profile-status{ font-size:11px; color:var(--ink-soft); }

  /* ---------- User modal ---------- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(22,18,16,0.45); z-index:20;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--peach-line);
    border-radius:var(--radius-lg); padding:20px; animation:rise .2s ease both;
  }
  .modal-title{ font-family:var(--font-display); font-size:18px; font-weight:700; margin:0 0 4px; }
  .modal-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }
  .user-list{ display:flex; flex-direction:column; gap:5px; max-height:180px; overflow-y:auto; margin-bottom:14px; }
  .user-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px; border:1px solid transparent;
    background:var(--peach); cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .user-item:hover{ border-color:var(--orange-soft); }
  .user-item.active{ border-color:var(--orange); }
  .user-item .ua{ width:26px; height:26px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .new-user-row{ display:flex; gap:8px; }
  .new-user-row input{
    flex:1; border:1.5px solid var(--peach-line); border-radius:11px; padding:9px 12px; font-size:13.5px;
    font-family:inherit; background:var(--cream); color:var(--ink); outline:none;
  }
  .new-user-row input:focus{ border-color:var(--orange-soft); }
  .new-user-row button{
    background:var(--orange); color:#fff; border:none; border-radius:11px; padding:0 14px; font-weight:700;
    font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .modal-close{
    margin-top:14px; width:100%; background:transparent; border:1px solid var(--peach-line); color:var(--ink-soft);
    border-radius:11px; padding:9px; font-size:13px; font-weight:600; cursor:pointer;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .topbar{
    display:none; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--peach-line);
    background:var(--surface);
  }
  .menu-btn{ background:none; border:none; cursor:pointer; padding:6px; border-radius:8px; }
  .menu-btn svg{ display:block; }
  .topbar .brand-name{ font-size:16px; }

  .chat-scroll{ flex:1; overflow-y:auto; padding:26px 20px 10px; }
  .chat-inner{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }

  /* Welcome state */
  .welcome{ max-width:640px; margin:4vh auto 0; text-align:center; padding:0 12px; }
  .welcome-mark{
    width:64px; height:64px; border-radius:18px; background:var(--orange); margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 10px 24px var(--shadow-orange);
    animation:pop .5s ease;
  }
  .welcome-mark span{ color:#fff; font-family:var(--font-display); font-weight:800; font-size:32px; }
  .welcome-mark .dot{ position:absolute; width:10px; height:10px; border-radius:50%; background:#fff; top:13px; right:12px; }
  .welcome h1{
    font-family:var(--font-display); font-size:30px; font-weight:700; margin:0 0 8px;
    animation:rise .5s ease .05s both;
  }
  .welcome p{ color:var(--ink-soft); font-size:15px; margin:0 0 30px; animation:rise .5s ease .1s both; }

  .suggest-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; text-align:start; }
  .ticket{
    position:relative; display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--peach-line); border-radius:16px;
    padding:14px 16px; cursor:pointer; overflow:hidden;
    animation:rise .5s ease both; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .ticket:nth-child(1){ animation-delay:.12s; }
  .ticket:nth-child(2){ animation-delay:.17s; }
  .ticket:nth-child(3){ animation-delay:.22s; }
  .ticket:nth-child(4){ animation-delay:.27s; }
  .ticket:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(42,33,24,0.08); border-color:var(--orange-soft); }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:16px; height:16px; background:var(--cream); border-radius:50%;
    top:50%; transform:translateY(-50%); border:1px solid var(--peach-line);
  }
  .ticket::before{ inset-inline-start:-9px; }
  .ticket::after{ inset-inline-end:-9px; }
  .ticket-stub{
    flex-shrink:0; width:38px; height:38px; border-radius:11px; background:var(--peach);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    border-inline-end:1.5px dashed var(--peach-line); padding-inline-end:14px; width:auto; padding-inline-start:8px;
  }
  .ticket-text{ font-size:13.5px; font-weight:600; line-height:1.3; }

  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pop{ from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }

  /* Messages */
  .msg-row{ display:flex; gap:11px; align-items:flex-start; animation:rise .35s ease both; }
  .msg-row.user{ flex-direction:row-reverse; }
  .avatar{ width:32px; height:32px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .avatar.bot{ background:var(--orange); position:relative; box-shadow:0 3px 8px var(--shadow-orange); }
  .avatar.bot span{ color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px; }
  .avatar.bot .dot{ position:absolute; width:4.5px; height:4.5px; border-radius:50%; background:#fff; top:6px; right:6px; }
  .avatar.user{ background:var(--peach); color:var(--orange-dark); font-weight:700; font-size:13px; }

  .bubble-wrap{ max-width:78%; display:flex; flex-direction:column; gap:8px; }
  .msg-row.user .bubble-wrap{ align-items:flex-end; }
  .bubble{
    padding:12px 15px; border-radius:16px; font-size:14.5px; line-height:1.55;
  }
  .msg-row.bot .bubble{ background:var(--surface); border:1px solid var(--peach-line); border-start-start-radius:5px; }
  .msg-row.user .bubble{ background:var(--orange); color:#fff; border-start-end-radius:5px; }
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble ul{ margin:6px 0; padding-inline-start:18px; }
  .bubble li{ margin-bottom:3px; }
  .bubble strong{ font-weight:700; }

  .typing{ display:flex; gap:4px; padding:14px 16px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--orange-soft); animation:blink 1.1s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:scale(.85);} 40%{ opacity:1; transform:scale(1);} }

  .sources-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .source-chip{
    display:flex; align-items:center; gap:5px; background:var(--peach); border:1px solid var(--peach-line);
    color:var(--orange-dark); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:20px;
    cursor:pointer; transition:background .15s ease;
  }
  .source-chip:hover{ background:#FFE3CB; }
  .source-panel{
    display:none; background:var(--peach); border:1px solid var(--peach-line); border-radius:12px;
    padding:10px 13px; font-size:12.5px; color:var(--ink); line-height:1.5; max-width:420px;
  }
  .source-panel.open{ display:block; animation:rise .2s ease both; }
  .source-panel b{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--orange-dark); margin-bottom:3px; }

  .timestamp{ font-size:10.5px; color:var(--ink-soft); padding:0 3px; }

  /* Composer */
  .composer-wrap{ padding:14px 20px 20px; background:linear-gradient(to top, var(--cream) 60%, transparent); }
  .composer{
    max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--surface); border:1.5px solid var(--peach-line); border-radius:20px; padding:9px 9px 9px 18px;
    box-shadow:0 8px 24px rgba(42,33,24,0.06);
    transition:border-color .15s ease;
  }
  html[dir="rtl"] .composer{ padding:9px 18px 9px 9px; }
  .composer:focus-within{ border-color:var(--orange-soft); }
  .composer textarea{
    flex:1; border:none; outline:none; resize:none; font-family:inherit; font-size:14.5px;
    max-height:140px; padding:8px 0; background:transparent; color:var(--ink); line-height:1.4;
  }
  .composer textarea::placeholder{ color:var(--ink-soft); }
  .send-btn{
    width:40px; height:40px; border-radius:13px; border:none; background:var(--orange); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:transform .12s ease, background .15s ease;
  }
  .send-btn:hover:not(:disabled){ transform:scale(1.05); background:var(--orange-dark); }
  .send-btn:disabled{ background:var(--orange-soft); cursor:not-allowed; opacity:.6; }
  .composer-hint{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:9px; }

  .backdrop{ display:none; position:fixed; inset:0; background:rgba(42,33,24,0.35); z-index:5; }

  @media (max-width: 860px){
    .sidebar{ position:fixed; inset-block:0; inset-inline-start:0; z-index:10; transform:translateX(-105%); }
    html[dir="rtl"] .sidebar{ transform:translateX(105%); }
    .sidebar.open{ transform:translateX(0); }
    .topbar{ display:flex; }
    .backdrop.show{ display:block; }
    .suggest-grid{ grid-template-columns:1fr; }
    .bubble-wrap{ max-width:88%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<div class="modal-backdrop" id="userModalBackdrop">
  <div class="modal-card">
    <h2 class="modal-title" id="userModalTitle">Switch user</h2>
    <p class="modal-sub" id="userModalSub">Each user's chats are saved on this device.</p>
    <div class="user-list" id="userList"></div>
    <div class="new-user-row">
      <input type="text" id="newUserInput" maxlength="24" />
      <button id="addUserBtn">＋</button>
    </div>
    <button class="modal-close" id="userModalClose">Close</button>
  </div>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark"><span>w</span><div class="dot"></div></div>
        <div>
          <div class="brand-name">Waffarha</div>
          <div class="brand-sub" id="brandSub">Customer Assistant</div>
        </div>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span id="newChatLabel">New chat</span>
      </button>
    </div>
    <div class="history-label" id="historyLabel">Recent</div>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-bottom-row">
        <button class="profile-chip" id="profileChip">
          <div class="profile-avatar" id="profileAvatar">🙂</div>
          <div>
            <div class="profile-name" id="profileName">Guest</div>
            <div class="profile-status" id="profileStatus">Not signed in</div>
          </div>
        </button>
      </div>
      <div class="sidebar-bottom-row">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
        <div class="lang-toggle">
          <button id="btnEn" class="active">EN</button>
          <button id="btnAr">AR</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="#2A2118" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand-mark" style="width:28px;height:28px;border-radius:8px;"><span style="font-size:13px;">w</span></div>
      <div class="brand-name">Waffarha</div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="composerInput" rows="1" placeholder="Ask about deals, cashback, orders..."></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="white"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composerHint">Waffarha Assistant can make mistakes. Verify important info.</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   i18n strings
   ============================================================ */
const STRINGS = {
  en: {
    tagline:"Customer Assistant", newChat:"New chat", recent:"Recent", guest:"Guest", notSignedIn:"Not signed in",
    placeholder:"Ask about deals, cashback, orders...", disclaimer:"Waffarha Assistant can make mistakes. Verify important info.",
    welcomeTitle:"Ahlan! 👋 How can I help?", welcomeSub:"Ask me anything about deals, cashback, your orders, or returns.",
    suggestions:[
      {icon:"🚚", text:"Where's my order?"},
      {icon:"💰", text:"How does cashback work?"},
      {icon:"🔥", text:"Today's best deals"},
      {icon:"↩️", text:"Return & refund policy"}
    ],
    greeting:"Hey there! I'm the Waffarha Assistant. I can help with orders, cashback, deals, returns, and payments — what do you need?",
    source:"Source", newConvo:"New conversation",
    deleteChat:"Delete chat", deleteConfirm:"Delete this conversation? This can't be undone.",
    switchUser:"Switch user", switchUserSub:"Each user's chats are saved on this device.",
    newUserPlaceholder:"Name a new user…", close:"Close", guestChats:"Guest", thisDevice:"On this device"
  },
  ar: {
    tagline:"مساعد العملاء", newChat:"محادثة جديدة", recent:"الأخيرة", guest:"زائر", notSignedIn:"لم يتم تسجيل الدخول",
    placeholder:"اسأل عن العروض، الكاش باك، الطلبات...", disclaimer:"مساعد وفرها ممكن يغلط أحياناً. تأكد من المعلومات المهمة.",
    welcomeTitle:"أهلاً! 👋 أقدر أساعدك إزاي؟", welcomeSub:"اسألني عن العروض، الكاش باك، طلباتك، أو الاسترجاع.",
    suggestions:[
      {icon:"🚚", text:"فين طلبي؟"},
      {icon:"💰", text:"الكاش باك بيشتغل إزاي؟"},
      {icon:"🔥", text:"أحسن عروض النهاردة"},

const THEME_KEY = 'waffarha_theme';
const USERS_KEY = 'waffarha_users';
const ACTIVE_USER_KEY = 'waffarha_active_user';
const chatsKey = (userId) => 'waffarha_chats_' + userId;

function getSystemTheme(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn){
    btn.innerHTML = theme === 'dark'
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z" fill="currentColor"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  applyTheme(saved || getSystemTheme());
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e)=>{
      if(!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
    });
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

function loadUsers(){
  try{ return JSON.parse(localStorage.getItem(USERS_KEY)) || []; } catch(e){ return []; }
}
function saveUsers(users){ localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function getActiveUserId(){ return localStorage.getItem(ACTIVE_USER_KEY) || 'guest'; }
function setActiveUserId(id){ localStorage.setItem(ACTIVE_USER_KEY, id); }

function loadChatsForUser(userId){
  try{
    const raw = localStorage.getItem(chatsKey(userId));
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function saveChats(){
  try{ localStorage.setItem(chatsKey(getActiveUserId()), JSON.stringify(chats)); } catch(e){}
}
function defaultChatsForUser(userId){
  return userId === 'guest' ? seedChats() : [];
}

function findAnswer(query, language){
  const q = query.toLowerCase();
  const kb = MOCK_KB[language] || MOCK_KB.en;
  for(const entry of kb){
    if(entry.keys.some(k => q.includes(k.toLowerCase()))){
      return { answer:entry.answer, sources:entry.sources };
    }
  }
  return FALLBACK[language] || FALLBACK.en;
}

function formatMessage(raw){
  let html = raw
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const lines = html.split("\n");
  let out = ""; let inList = false;
  for(const line of lines){
    const trimmed = line.trim();
    if(trimmed.startsWith("- ")){
      if(!inList){ out += "<ul>"; inList = true; }
      out += `<li>${trimmed.slice(2)}</li>`;
    } else if(/^\d+\.\s/.test(trimmed)){
      if(!inList){ out += "<ul>"; inList = true; }
      out += `<li>${trimmed.replace(/^\d+\.\s/, "")}</li>`;
    } else {
      if(inList){ out += "</ul>"; inList = false; }
      if(trimmed.length) out += `<p>${trimmed}</p>`;
    }
  }
  if(inList) out += "</ul>";
  return out;
}

function appendMessage(role, text, sources, persist=true){
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubbleId = 'b' + Math.random().toString(36).slice(2,9);
  row.innerHTML = `
    ${role==='bot' ? avatarBot() : avatarUser()}
    <div class="bubble-wrap">
      <div class="bubble" id="${bubbleId}"></div>
      ${sources && sources.length ? `<div class="sources-row" id="${bubbleId}-src"></div>` : ''}
    </div>`;
  chatInner.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;

  const bubbleEl = row.querySelector('.bubble');
  if(role === 'user'){
    bubbleEl.textContent = text;
  } else {
    bubbleEl.innerHTML = formatMessage(text);
  }

  if(sources && sources.length){
    const srcRow = row.querySelector(`#${bubbleId}-src`);
    sources.forEach((src, i)=>{
      const chip = document.createElement('button');
      chip.className = 'source-chip';
      chip.innerHTML = `📄 ${src.title}`;
      const panel = document.createElement('div');
      panel.className = 'source-panel';
      panel.innerHTML = `<b>${STRINGS[lang].source}</b>${src.snippet}`;
      chip.addEventListener('click', ()=> panel.classList.toggle('open'));
      srcRow.appendChild(chip);
      row.querySelector('.bubble-wrap').appendChild(panel);
    });
  }
  chatScroll.scrollTop = chatScroll.scrollHeight;

  if(persist){
    const chat = chats.find(c=>c.id===activeChatId);
    if(chat){
      chat.messages.push({ role, text, sources: sources || [] });
      saveChats();
    }
  }
}

  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `${avatarBot()}<div class="bubble-wrap"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
  chatInner.appendChild(row);

}
function removeTyping(){

function streamBotMessage(fullText, sources){
  return new Promise(resolve=>{
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const bubbleId = 'b' + Math.random().toString(36).slice(2,9);
    row.innerHTML = `${avatarBot()}<div class="bubble-wrap"><div class="bubble" id="${bubbleId}"></div></div>`;
    chatInner.appendChild(row);
    const bubbleEl = row.querySelector('.bubble');
    const words = fullText.split(' ');
    let i = 0;
    const interval = setInterval(()=>{
      i++;
      bubbleEl.textContent = words.slice(0, i).join(' ');
      chatScroll.scrollTop = chatScroll.scrollHeight;
      if(i >= words.length){
        clearInterval(interval);
        bubbleEl.innerHTML = formatMessage(fullText);
        if(sources && sources.length){
          const srcRow = document.createElement('div');
          srcRow.className = 'sources-row';
          sources.forEach(src=>{
            const chip = document.createElement('button');
            chip.className = 'source-chip';
            chip.innerHTML = `📄 ${src.title}`;
            const panel = document.createElement('div');
            panel.className = 'source-panel';
            panel.innerHTML = `<b>${STRINGS[lang].source}</b>${src.snippet}`;
            chip.addEventListener('click', ()=> panel.classList.toggle('open'));
            srcRow.appendChild(chip);
            row.querySelector('.bubble-wrap').appendChild(panel);
          });
          row.querySelector('.bubble-wrap').insertBefore(srcRow, row.querySelector('.bubble-wrap').children[1]);
        }
        chatScroll.scrollTop = chatScroll.scrollHeight;
        const chat = chats.find(c=>c.id===activeChatId);
        if(chat){
          chat.messages.push({ role:'bot', text: fullText, sources: sources || [] });
          saveChats();
        }
        resolve();
      }
    }, 35);
  });
}

/* ============================================================
   RAG hook — calls the real backend (app.py -> rag_engine.RagEngine)
   ============================================================ */
// When index.html is served BY app.py (uvicorn), '' + '/api/chat' is
// same-origin and just works. When it's served separately (e.g. GitHub
// Pages), the backend lives on a different origin, so point this at your
// deployed backend's full URL, e.g. 'https://waffarha-api.onrender.com'.
// Leave it '' for local/same-origin use.
const API_BASE = '';

const CHAT_API_ERROR = {
  en: "I'm having trouble reaching the assistant backend right now. Please try again in a moment.",
  ar: "في مشكلة في الوصول لسيرفر المساعد دلوقتي. جرب تاني بعد شوية."
};

async function getBotResponse(userText){
  const chat = chats.find(c=>c.id===activeChatId);
  // Send prior turns only — the message just typed is passed separately as
  // `query`, and it's already the last entry in chat.messages by this point
  // (appendMessage() persisted it before submitMessage() called us).
  const priorMessages = chat ? chat.messages.slice(0, -1) : [];
  const history = priorMessages
    .filter(m => m.role === 'user' || m.role === 'bot')
    .map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));

  try{
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: userText, lang, history })
    });
    if(!res.ok){
      const detail = await res.json().catch(()=>null);
      throw new Error(detail && detail.detail ? detail.detail : `HTTP ${res.status}`);
    }
    const data = await res.json();
    return { answer: data.answer, sources: data.sources || [] };
  } catch(err){
    console.error('Chat API error:', err);
    return { answer: CHAT_API_ERROR[lang] || CHAT_API_ERROR.en, sources: [] };
  }
}

async function submitMessage(text){
  if(!text || !text.trim()) return;
  if(!activeChatId) startNewChat(false);

  if(chatInner.querySelector('.welcome')){
    chatInner.innerHTML = '';
    appendMessage('bot', STRINGS[lang].greeting, []);
  }

  appendMessage('user', text, []);
  updateChatTitle(text);
  composerInput.value = '';
  autoGrow();
  toggleSend();

  appendTyping();
  const { answer, sources } = await getBotResponse(text);
  removeTyping();
  await streamBotMessage(answer, sources);
}

   Chat history / sidebar
   ============================================================ */
function renderHistory(){
  historyList.innerHTML = '';
  chats.forEach(chat=>{
    const item = document.createElement('button');
    item.className = 'history-item' + (chat.id === activeChatId ? ' active' : '');
    item.innerHTML = `
      <div class="hi-dot"></div>
      <div class="hi-text">${chat.title}</div>
      <span class="hi-delete" role="button" tabindex="0" title="${STRINGS[lang].deleteChat}" aria-label="${STRINGS[lang].deleteChat}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>`;
    item.addEventListener('click', ()=> loadChat(chat.id));
    const delBtn = item.querySelector('.hi-delete');
    delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteChat(chat.id); });
    delBtn.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); deleteChat(chat.id); }
    });
    historyList.appendChild(item);
  });
}

function loadChat(id){
  activeChatId = id;
  const chat = chats.find(c=>c.id===id);
  if(!chat) return;
  if(chat.messages.length === 0){
    renderWelcome();
  } else {
    chatInner.innerHTML = '';
    chat.messages.forEach(m => appendMessage(m.role, m.text, m.sources, false));
  }
  renderHistory();
  closeSidebarMobile();
}

function deleteChat(id){
  if(!confirm(STRINGS[lang].deleteConfirm)) return;
  chats = chats.filter(c=>c.id!==id);
  saveChats();
  if(activeChatId === id){
    activeChatId = null;
    if(chats.length){
      loadChat(chats[0].id);
    } else {
      renderWelcome();
      renderHistory();
    }
  } else {
    renderHistory();
  }
}

function updateChatTitle(text){
  const chat = chats.find(c=>c.id===activeChatId);
  if(chat && chat.title === STRINGS[lang].newConvo){
    chat.title = text.length > 34 ? text.slice(0,34)+'…' : text;
    saveChats();
    renderHistory();
  }
}

function startNewChat(render=true){
  // Reuse the most recent chat if it's already empty, instead of piling up blanks
  if(chats.length && chats[0].messages.length === 0){
    activeChatId = chats[0].id;
  } else {
    const id = 'c' + Date.now();
    chats.unshift({ id, title: STRINGS[lang].newConvo, messages:[] });
    activeChatId = id;
    saveChats();
  }
  if(render){
    renderWelcome();
    renderHistory();
    closeSidebarMobile();
  }
}

   ============================================================ */
function autoGrow(){
  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 140) + 'px';
}
function toggleSend(){
  sendBtn.disabled = composerInput.value.trim().length === 0;
}
composerInput.addEventListener('input', ()=>{ autoGrow(); toggleSend(); });
composerInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if(!sendBtn.disabled) submitMessage(composerInput.value);
  }
});
sendBtn.addEventListener('click', ()=> submitMessage(composerInput.value));

/* ============================================================
   Sidebar / mobile
   ============================================================ */
document.getElementById('newChatBtn').addEventListener('click', ()=> startNewChat(true));
document.getElementById('menuBtn').addEventListener('click', ()=>{
  sidebar.classList.add('open'); backdrop.classList.add('show');
});
backdrop.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){
  sidebar.classList.remove('open'); backdrop.classList.remove('show');
}

/* ============================================================
   Dark mode toggle
   ============================================================ */
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

/* ============================================================
   User account switcher
   ============================================================ */
const profileChip = document.getElementById('profileChip');
const userModalBackdrop = document.getElementById('userModalBackdrop');
const userList = document.getElementById('userList');
const newUserInput = document.getElementById('newUserInput');

function updateProfileUI(){
  const s = STRINGS[lang];
  const userId = getActiveUserId();
  const users = loadUsers();
  const user = users.find(u=>u.id===userId);
  document.getElementById('profileName').textContent = user ? user.name : s.guestChats;
  document.getElementById('profileStatus').textContent = s.thisDevice;
  document.getElementById('profileAvatar').textContent = user ? user.name.trim().charAt(0).toUpperCase() : '🙂';
}

function renderUserModal(){
  const s = STRINGS[lang];
  document.getElementById('userModalTitle').textContent = s.switchUser;
  document.getElementById('userModalSub').textContent = s.switchUserSub;
  newUserInput.placeholder = s.newUserPlaceholder;
  document.getElementById('userModalClose').textContent = s.close;

  const users = loadUsers();
  const activeId = getActiveUserId();
  userList.innerHTML = '';

  const guestItem = document.createElement('button');
  guestItem.className = 'user-item' + (activeId === 'guest' ? ' active' : '');
  guestItem.innerHTML = `<div class="ua">🙂</div><div>${s.guestChats}</div>`;
  guestItem.addEventListener('click', ()=> switchUser('guest'));
  userList.appendChild(guestItem);

  users.forEach(u=>{
    const item = document.createElement('button');
    item.className = 'user-item' + (activeId === u.id ? ' active' : '');
    item.innerHTML = `<div class="ua">${u.name.trim().charAt(0).toUpperCase()}</div><div>${u.name}</div>`;
    item.addEventListener('click', ()=> switchUser(u.id));
    userList.appendChild(item);
  });
}

function openUserModal(){
  renderUserModal();
  newUserInput.value = '';
  userModalBackdrop.classList.add('show');
}
function closeUserModal(){
  userModalBackdrop.classList.remove('show');
}

function switchUser(userId){
  setActiveUserId(userId);
  const stored = loadChatsForUser(userId);
  chats = stored !== null ? stored : defaultChatsForUser(userId);
  if(stored === null) saveChats();
  activeChatId = null;
  renderWelcome();
  renderHistory();
  updateProfileUI();
  closeUserModal();
}

function createUser(){
  const name = newUserInput.value.trim();
  if(!name) return;
  const users = loadUsers();
  const id = 'u' + Date.now();
  users.push({ id, name });
  saveUsers(users);
  switchUser(id);
}

profileChip.addEventListener('click', openUserModal);
document.getElementById('userModalClose').addEventListener('click', closeUserModal);
userModalBackdrop.addEventListener('click', (e)=>{ if(e.target === userModalBackdrop) closeUserModal(); });
document.getElementById('addUserBtn').addEventListener('click', createUser);
newUserInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); createUser(); } });

/* ============================================================
   Language toggle
   ============================================================ */
document.getElementById('btnEn').addEventListener('click', ()=> setLang('en'));
document.getElementById('btnAr').addEventListener('click', ()=> setLang('ar'));

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btnEn').classList.toggle('active', l==='en');
  document.getElementById('btnAr').classList.toggle('active', l==='ar');

  const s = STRINGS[l];
  document.getElementById('brandSub').textContent = s.tagline;
  document.getElementById('newChatLabel').textContent = s.newChat;
  document.getElementById('historyLabel').textContent = s.recent;
  composerInput.placeholder = s.placeholder;
  document.getElementById('composerHint').textContent = s.disclaimer;
  updateProfileUI();

  // refresh titles for still-untitled chats
  chats.forEach(c=>{ if(c.title === STRINGS.en.newConvo || c.title === STRINGS.ar.newConvo) c.title = s.newConvo; });
  saveChats();

  if(chatInner.querySelector('.welcome')) renderWelcome();
  renderHistory();
  if(userModalBackdrop.classList.contains('show')) renderUserModal();
}

/* ============================================================
   Init
   ============================================================ */
initTheme();

(function initApp(){
  let activeUserId = getActiveUserId();
  const knownUsers = loadUsers();
  if(activeUserId !== 'guest' && !knownUsers.find(u=>u.id===activeUserId)){
    activeUserId = 'guest';
    setActiveUserId('guest');
  }
  const stored = loadChatsForUser(activeUserId);
  chats = stored !== null ? stored : defaultChatsForUser(activeUserId);
  if(stored === null) saveChats();
  activeChatId = null;
  renderWelcome();
  renderHistory();
  updateProfileUI();
})();
</script>
</body>
</html>
