[pytest]
# Fast daily baseline: collect tests/ only, and skip the 'engine' markers.
# The engine-marked tests build a real RagEngine (BGE-M3 model + vector
# index, ~47s per engine) per test, so they are opt-in:
#   pytest                        # fast baseline (engine tests skipped)
#   pytest -m engine              # full suite incl. index/model-dependent tests
testpaths = tests
addopts = -m "not engine"
markers =
    engine: requires a real RagEngine (embedding model + vector index + Ollama); skipped by default for a fast baseline