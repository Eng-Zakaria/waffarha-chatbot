# Local ClickHouse for development/testing
# Run with: docker compose -f docker-compose.local-clickhouse.yml up -d
#
# This provides a local ClickHouse instance that mirrors the remote structure
# but can be modified for testing (unlike the remote read-only instance).

services:
  clickhouse-local:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-local
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: main
    volumes:
      - clickhouse_local_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  clickhouse_local_data: